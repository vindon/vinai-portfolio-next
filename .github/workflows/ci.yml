name: CI

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E, visual regression, and accessibility tests
        run: npm run test:e2e

      - name: TEMP - generate Linux visual-regression baselines
        if: always()
        run: npx playwright test e2e/responsive.spec.ts --update-snapshots

      - name: TEMP - upload generated baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: e2e/responsive.spec.ts-snapshots/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
