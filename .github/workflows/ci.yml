name: CI

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        # A dummy analytics token so the e2e/a11y suite actually exercises
        # CookieConsent — NEXT_PUBLIC_* vars are inlined at build time, so
        # this can't be set later on the e2e/webServer step. It never beacons
        # anywhere meaningful; it just needs to be a non-empty string.
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: test-token-e2e
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # TEMP: regenerate stale Linux visual-regression baselines after this
      # session's content changes (wordmark, footer, demo links, color,
      # coming-soon gate) shifted page height. Remove this step once the
      # regenerated baselines are committed.
      - name: TEMP - regenerate Linux visual-regression baselines
        run: npx playwright test e2e/responsive.spec.ts --update-snapshots || true

      - name: TEMP - upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: updated-baselines
          path: e2e/responsive.spec.ts-snapshots/

      - name: E2E, visual regression, and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
